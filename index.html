<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Khảo sát nghiên cứu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECF1F2; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#16232A; --muted:#56676F; --line:#D3DDE1;
  --accent:#1D5E77; --accent-ink:#FFFFFF; --accent-soft:#E0EDF2; --focus:#2C83A6;
  --danger:#A8291F; --ph-bg:#FFF1BF; --ph-ink:#5E4600; --test:#7A4B00; --test-bg:#FFE7A8;
  --app-brand:#5E3768; --app-bg:#F5F3F6; --app-card:#FFFFFF; --app-ink:#1E1A21; --app-muted:#6E6873; --app-line:#E5E0E7;
  --app-price:#B3361F; --app-info-bg:#ECEFF2; --app-info-ink:#353C43; --app-frame:#121416;
  --f-ui:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0E1417;--surface:#162026;--surface-2:#1B2830;--ink:#E3EBEE;--muted:#98A9B1;--line:#2A3A42;
    --accent:#6DB5D1;--accent-ink:#0A1A20;--accent-soft:#1C3440;--focus:#8FD0E8;--danger:#F08A80;
    --ph-bg:#4A3B0C;--ph-ink:#FFE38F;--test:#FFE38F;--test-bg:#4A3B0C;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
img{max-width:100%}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.testbar{background:var(--test-bg);color:var(--test);font-size:13px;font-weight:600;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.sheet{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sh-top{padding:14px 22px 0;display:grid;gap:10px}
.org{font-size:12.5px;color:var(--muted)}
.prog{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sh-body{padding:18px 22px 6px;display:grid;gap:18px}
.sh-foot{padding:14px 22px 20px;display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.sh-foot .note{font-size:13px;color:var(--muted);margin-right:auto}
.next{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 26px;font-weight:600;font-size:15px;cursor:pointer;min-width:120px}
.next[disabled]{opacity:.45;cursor:not-allowed}
h1.st{font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
h2.pt{font-size:17px;margin:0;text-wrap:balance}
.lead{margin:0}
.intro{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
.prose p{margin:0 0 10px}.prose p:last-child{margin-bottom:0}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.ph{background:var(--ph-bg);color:var(--ph-ink);border-radius:4px;padding:0 4px;font-weight:500}
.code{font-family:var(--f-code);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:8px;white-space:nowrap}
body:not(.test) .code,body:not(.test) .rnote{display:none}
.rnote{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
fieldset.q{border:0;margin:0;padding:0;min-width:0}
fieldset.q legend{padding:0;margin:0 0 10px;font-weight:500;width:100%}
.q + .q{border-top:1px dashed var(--line);padding-top:16px}
.q.err legend{color:var(--danger)}
.q .emsg{display:none;font-size:13px;color:var(--danger);margin-top:8px}
.q.err .emsg{display:block}
.scale{display:grid;gap:6px}
.scale.n7{grid-template-columns:repeat(7,minmax(0,1fr))}
.scale.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);font-size:12px;line-height:1.3;color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt:has(input:checked) .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 0 45%,transparent 50%)}
.opt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.opt .num{font-family:var(--f-code);font-size:11px}
@media (max-width:620px){
  .scale.n7,.scale.n5{grid-template-columns:1fr}
  .opt{flex-direction:row;justify-content:flex-start;text-align:left;padding:9px 12px;gap:10px;font-size:13.5px}
  .opt .num{order:3;margin-left:auto}
}
.list{display:grid;gap:6px}
.li{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);flex-wrap:wrap}
.li input{margin-top:4px;accent-color:var(--accent)}
.li:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.li .othr{margin-left:auto;flex:1 1 140px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}
.li .sub{color:var(--muted);font-size:12.5px}
input.num-in,textarea.txt{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);width:100%}
input.num-in{max-width:140px}
textarea.txt{min-height:92px;resize:vertical}
.gridq{overflow-x:auto}
.gridq table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.gridq th,.gridq td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
.gridq th:first-child,.gridq td:first-child{text-align:left}
.gridq thead th{font-weight:500;color:var(--muted);font-size:12.5px}
.gridq input{accent-color:var(--accent);width:18px;height:18px}
.sd{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.sd .l{text-align:right}.sd .r{text-align:left}
.sd .pts{display:flex;gap:5px}
.sd .pt{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;cursor:pointer;font-family:var(--f-code);font-size:12px;color:var(--muted)}
.sd .pt input{position:absolute;opacity:0}
.sd .pt:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sd .pt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:620px){.sd{grid-template-columns:1fr 1fr}.sd .pts{grid-column:1/-1;grid-row:2;justify-content:space-between}.sd .l{text-align:left}.sd .r{text-align:right}.sd .pt{width:32px;height:32px}}
.scen{padding:16px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.scen .tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.scen p{margin:0 0 10px}.scen p:last-child{margin:0}
.stimwrap{display:grid;justify-items:center;gap:8px}
.thumbrow{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.thumbrow .cap{font-size:13px;color:var(--muted);min-width:0}
.thumbrow .pfit{flex:none}
.statusbox{display:grid;gap:12px;padding:6px 0}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn2{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;justify-self:start}
pre.csv{font-family:var(--f-code);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;max-height:240px}
/* app mock-up: fixed colours, it is a screenshot */
.pfit{position:relative;overflow:hidden;max-width:100%}
.pfit > .phone{position:absolute;top:0;left:0;transform-origin:0 0}
.phone{width:336px;height:585px;background:var(--app-frame);border-radius:40px;padding:8px;box-shadow:0 10px 30px rgba(10,20,30,.22)}
.scr{position:relative;width:320px;height:569px;border-radius:32px;overflow:hidden;background:var(--app-bg);color:var(--app-ink);font-family:var(--f-ui);font-size:12px;line-height:1.35}
.sbar{height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11px;font-weight:600;color:var(--app-ink)}
.sbar svg{display:block}
.ahd{height:46px;background:var(--app-brand);color:#fff;display:flex;align-items:center;gap:9px;padding:0 14px}
.ahd .lg{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--app-brand);display:grid;place-items:center;font-weight:700;font-size:15px}
.ahd .nm{font-weight:700;font-size:15px}
.ahd .ct{margin-left:auto;display:block}
.srch{margin:8px 10px 0;height:34px;border-radius:9px;background:#fff;border:1px solid var(--app-line);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--app-muted);font-size:11.5px}
.chps{display:flex;gap:6px;padding:9px 10px 0;overflow:hidden}
.chps span{flex:none;background:#fff;border:1px solid var(--app-line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--app-ink)}
.hello{padding:10px 12px 0;font-weight:600;font-size:12.5px}
.sec{margin:8px 10px 0;background:var(--app-card);border-radius:12px;padding:10px;border:1px solid var(--app-line)}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sech b{font-size:14px}
.sech span{font-size:10.5px;color:var(--app-muted)}
.info{display:flex;gap:7px;align-items:flex-start;background:var(--app-info-bg);color:var(--app-info-ink);border-radius:8px;padding:7px 9px;margin-bottom:9px;font-size:11px;line-height:1.38}
.info svg{flex:none;margin-top:1px}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{display:flex;flex-direction:column;gap:3px}
.pc .im{border-radius:8px;overflow:hidden;aspect-ratio:1/1;background:#F4F1EC}
.pc .im svg{display:block;width:100%;height:100%}
.pc .n{font-size:11px;font-weight:500;line-height:1.3;min-height:43px}
.pc .qy{font-size:10px;color:var(--app-muted)}
.pc .pr{font-size:12.5px;font-weight:700;color:var(--app-price)}
.pc .ad{margin-top:3px;border:1px solid var(--app-brand);color:var(--app-brand);border-radius:6px;text-align:center;font-size:10.5px;font-weight:600;padding:3px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:10.5px}
.cats i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 4px;border-radius:12px;background:#F1ECF2}
.bnav{position:absolute;left:0;right:0;bottom:0;height:54px;background:#fff;border-top:1px solid var(--app-line);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font-size:9.5px;color:var(--app-muted);padding-bottom:6px}
.bnav div{display:grid;justify-items:center;gap:2px}
.bnav .on{color:var(--app-brand);font-weight:600}
.rhd{height:44px;background:#E9ECEF;display:flex;align-items:center;gap:10px;padding:0 14px;color:#5B636B}
.rph{background:#E3E6EA;border-radius:4px;height:8px}
.msg{margin:10px 10px 0;background:var(--app-card);border:1px solid var(--app-line);border-radius:12px;padding:10px}
.msg .mh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;margin-bottom:8px}
.msg .av{width:26px;height:26px;border-radius:50%;background:#D9DDE2}
.bub{background:#EEF1F4;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:11.5px;line-height:1.4}
.illu{position:absolute;top:30px;right:12px;background:rgba(20,24,28,.72);color:#fff;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px}
.k2{width:460px;max-width:100%;background:#fff;color:#1E1A21;border:1px solid #E1DCE3;border-radius:14px;padding:18px 18px 8px;font-family:var(--f-ui)}
.k2 .k2h{font-weight:700;font-size:16px;color:#5E3768;margin-bottom:6px;line-height:1.3}
.k2 .row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid #EEE9F0}
.k2 .row:first-of-type{border-top:0}
.k2 .ic{flex:none;width:42px;height:42px;border-radius:12px;background:#F3EEF5;display:grid;place-items:center;color:#5E3768}
.k2 .lb{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#7A7280;margin-bottom:2px}
.k2 .tx{font-size:14.5px;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="testbar" id="testbar" hidden>Chế độ thử: câu trả lời không được lưu. Bỏ "&amp;test=1" khỏi link khi chạy thật.</div>
<main id="main"><div class="sheet"><div class="sh-body"><p class="lead">Đang tải khảo sát…</p></div></div></main>
<script>
(function(){
"use strict";
/* ================= setup ================= */
const CFG=window.SURVEY_CONFIG||{};
const Q=new URLSearchParams(location.search);
const STUDY=+Q.get("s");
const TEST=Q.get("test")==="1";
const MODE=(STUDY===1&&Q.get("mode")==="pilot")?"pilot":"main";
const PID=(Q.get(CFG.PID_PARAM||"pid")||"").slice(0,120);
const DP_KEY=String(STUDY)+(MODE==="pilot"?"-pilot":"");
const DP_ID=((CFG.DATAPIPE_ID||{})[DP_KEY]||"").trim();
const RID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const DONE_KEY=`chuoiA_s${DP_KEY}_done`;
const API="https://pipe.jspsych.org/api/";
if(TEST){document.body.classList.add("test");document.getElementById("testbar").hidden=false}

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LIK=["Hoàn toàn không đồng ý","Không đồng ý","Hơi không đồng ý","Trung lập","Hơi đồng ý","Đồng ý","Hoàn toàn đồng ý"];
const FREQ=["Chưa bao giờ","Hiếm khi (1 lần)","Thỉnh thoảng (2–3 lần)","Khá thường xuyên (4–5 lần)","Rất thường xuyên (hơn 5 lần)"];
const CHAINS=(CFG.CHAINS&&CFG.CHAINS.length)?CFG.CHAINS:[{v:1,name:"[Chuỗi 1]",cat:1}];
const QUOTA_FULL=(CFG.QUOTA_FULL||[]).map(Number);
const CATS={1:{n:"điện máy",nh:"đồ điện máy, điện thoại"},2:{n:"nhà thuốc",nh:"thuốc và sản phẩm sức khỏe"},3:{n:"mỹ phẩm",nh:"mỹ phẩm và đồ chăm sóc cá nhân"},4:{n:"siêu thị",nh:"thực phẩm và đồ dùng hằng ngày"}};
const PCH=[[1,"Mục gợi ý trong app hoặc website"],[2,"Thông báo đẩy của app"],[3,"SMS"],[4,"Zalo"],[5,"Email"]];
const PRICES=["45.000 đ","59.000 đ","32.000 đ"];
const PRODUCTS={
  X:[{k:"almond",n:"Sữa hạnh nhân không đường",q:"Hộp 1 L"},{k:"oats",n:"Yến mạch nguyên chất",q:"Túi 500 g"},{k:"wgbread",n:"Bánh mì nguyên cám ít đường",q:"Gói 400 g"}],
  Y:[{k:"milk",n:"Sữa tươi tiệt trùng",q:"Hộp 1 L"},{k:"cereal",n:"Ngũ cốc ăn sáng",q:"Hộp 300 g"},{k:"sandwich",n:"Bánh mì sandwich",q:"Gói 400 g"}]
};
const BLOCK_LINE="Gợi ý này chỉ dựa trên các sản phẩm bạn đã xem trong app. Chuỗi A không dùng lịch sử mua tại cửa hàng để gợi ý.";
const PROFILE_TXT={0:"sữa thực vật không đường, yến mạch nguyên chất và đồ ăn sáng ít đường",1:"sữa tươi, ngũ cốc ăn sáng và bánh mì sandwich"};
const cfgv=k=>{const v=String(CFG[k]??"");return v.startsWith("[")?`<span class="ph">${esc(v)}</span>`:esc(v)};
function chainOf(s){return CHAINS.find(c=>c.v===s.emb.RETAILER)}
function fmt(s,t){
  const ch=chainOf(s);
  const A=ch?esc(ch.name):"chuỗi bạn đã chọn";
  const NH=ch&&CATS[ch.cat]?CATS[ch.cat].nh:"sản phẩm của chuỗi";
  return String(t).replace(/\{A\}/g,A).replace(/\{NH\}/g,NH).replace(/\{CFG:(\w+)\}/g,(m,k)=>cfgv(k));
}
const code=c=>`<span class="code">${esc(c)}</span>`;
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const L=items=>items.map(([c,t])=>({c,t}));

/* ================= product art and stimuli ================= */
function art(k){
  const T=(x,y,s,fill,txt,w=700)=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${fill}" text-anchor="middle" font-family="Be Vietnam Pro, Arial, sans-serif">${txt}</text>`;
  const carton=(body,top,cap,band,b1,b2,small,sf)=>`<path d="M32 31 L50 15 L68 31 Z" fill="${top}"/><rect x="45.5" y="10" width="9" height="7" rx="1.5" fill="${cap}"/><path d="M32 31 H68 V88 Q68 91 65 91 H35 Q32 91 32 88 Z" fill="${body}" stroke="rgba(0,0,0,.08)"/>`+T(50,41,4.6,sf,small,600)+`<rect x="32" y="46" width="36" height="20" fill="${band}"/>`+T(50,54.5,5.6,"#fff",b1)+T(50,62.5,5.6,"#fff",b2);
  const bag=(loaf,crust,band,txt)=>`<rect x="16" y="34" width="68" height="50" rx="12" fill="#ECE6DA" stroke="rgba(0,0,0,.07)"/><rect x="82" y="52" width="7" height="10" rx="2.5" fill="#C9BFAE"/><path d="M23 77 V53 Q23 41 36 41 H64 Q77 41 77 53 V77 Z" fill="${loaf}" stroke="${crust}" stroke-width="2"/><rect x="16" y="62" width="68" height="12" fill="${band}"/>`+T(50,70.3,5.2,"#fff",txt);
  const svg=b=>`<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#F4F1EC"/>${b}</svg>`;
  switch(k){
    case "almond":return svg(carton("#F2E7D3","#E3D3B7","#C7AD86","#7C5333","SỮA","HẠNH NHÂN","KHÔNG ĐƯỜNG","#7C5333")+`<ellipse cx="50" cy="78" rx="4.6" ry="7.6" transform="rotate(28 50 78)" fill="#B57B4B"/><ellipse cx="57" cy="80" rx="3.6" ry="6" transform="rotate(-20 57 80)" fill="#9C653A"/>`);
    case "milk":return svg(carton("#FFFFFF","#E8EEF4","#9DB6D3","#2F6CB2","SỮA TƯƠI","TIỆT TRÙNG","1 LÍT","#2F6CB2")+`<path d="M50 70 C46.5 75.5 45 78.5 45 81 A5 5 0 0 0 55 81 C55 78.5 53.5 75.5 50 70 Z" fill="#7FA8D8"/>`);

function eligible(s){return CHAINS.filter(c=>s.ans["SC2_"+c.v]===1&&s.ans["CH_"+c.v]===3)}
function chooseRetailer(s,v){
  const set=c=>{s.emb.RETAILER=c.v;s.emb.CATEGORY=c.cat};
  const ch=CHAINS.find(c=>c.v===v);if(!ch)return null;
  if(!QUOTA_FULL.includes(v)){set(ch);s.emb.RET_SWITCH=0;return null}
  const alt=eligible(s).find(c=>!QUOTA_FULL.includes(c.v));
  if(alt){set(alt);s.emb.RET_SWITCH=1;return null}
  return {quota:"Chuỗi đủ điều kiện đã đủ quota"};
}

async function assign(s){
  let c,src;
  if(TEST){c=Math.floor(Math.random()*8);src="test"}
  else{
    try{
      const r=await fetch(API+"condition/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"*/*"},body:JSON.stringify({experimentID:DP_ID})});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&Number.isInteger(j.condition)){c=((j.condition%8)+8)%8;src="datapipe"}
      else s.emb.COND_ERROR=j.error||("HTTP_"+r.status);
    }catch(e){s.emb.COND_ERROR="NETWORK"}
    if(c===undefined){c=Math.floor(Math.random()*8);src="local"}
  }
  const g=Math.floor(c/2)+1;
  s.emb.CONDITION=c;s.emb.COND_SOURCE=src;s.emb.GROUP=g;s.emb.CELL=c+1;s.emb.PROFILE=c%2;
  s.emb.INTEG=(g-1)>>1;
  if(STUDY===2)s.emb.PERS=(g-1)&1;else s.emb.BLOCK=(g-1)&1;
  s.emb.ORDER=Math.random()<.5?1:2;
}

/* ================= columns (same header in every file of a study) ================= */
function columns(){
  const meta=["trial_type","STUDY","MODE","RID","PID","STATUS","SCREENOUT_REASON","START_TIME","END_TIME","TOTAL_SEC","SCREEN_W","TEST"];
  const it=a=>a.map(x=>x.c);
  let cols;
  if(STUDY===1){
    cols=["CONSENT","SC1",...CHAINS.map(c=>"SC2_"+c.v),"SC2_0",...CHAINS.map(c=>"CH_"+c.v),"SC4","RETAILER","CATEGORY","RET_SWITCH",...PCH.map(([v])=>"PCH_"+v),"PCH_0","SC6","SC7",
      ...it(ITEMS.RS),...it(ITEMS.PCI),"REC1","REC2",...it(ITEMS.PAP),...it(ITEMS.PPV),...it(ITEMS.LOY),...it(ITEMS.ATCB),"FIL1","FIL2",...it(ITEMS.CRP),...(MODE==="pilot"?it(ITEMS.PI):[]),
      ...it(ITEMS.IUIPC),"IRI2",...it(ITEMS.PPR),...[1,2,3,4,5,6].flatMap(k=>["PPR_R"+k,"PPR_R"+k+"_TEXT"]),...it(ITEMS.PCDL),...it(ITEMS.TAI),...it(ITEMS.AL),...it(ITEMS.PSE),"D1","D2","D3","D4","D5","SERIOUS","D6"];
    if(MODE==="pilot")cols.push(...PAGES.filter(p=>p.blocks.some&&p.blocks.some(b=>b.c&&String(b.c).startsWith("CMT_"))).map(p=>"CMT_"+p.id));
  }else{
    cols=["CONSENT","SC1","SC2","SC3","IMCQ","IMCQ_TEXT","IMC","PRE1","PRE2","CONDITION","COND_SOURCE","COND_ERROR","GROUP","CELL","INTEG",STUDY===2?"PERS":"BLOCK","PROFILE","ORDER",
      ...it(ITEMS.xPPV),...it(ITEMS.xCRP),...(STUDY===3?it(ITEMS.xAMB):[]),...it(ITEMS.xLOY),"ATT1","ATT2","ATT3",...it(ITEMS.REAL),...it(ITEMS.xMC),...it(ITEMS.xPCDL),
      ...(STUDY===3?["SRC","SRC_OK",...it(ITEMS.xBEL)]:[]),"CHK_REC","CHK_REC_OK",...it(ITEMS.IUIPC.slice(6)),"PROBE","D1","D2","D3","D4","D5","SERIOUS","WITHDRAW"];
  }
  const ids=PAGES.map(p=>({out1:"ppv",out2:"crp",out3:"amb"}[p.id]||p.id));
  const ORD=new Set(["sc2","rs","pci","pap","ppv","loy","filler","crp","pi","iuipc","pcdl","tai","al","pse","amb","mc","bel"]);
  const tcols=ids.map(id=>"T_"+id), ocols=ids.filter(id=>ORD.has(id)).map(id=>"ORD_"+id);
  return meta.concat(cols,tcols,ocols);
}
function csvCell(v){if(v===undefined||v===null)return "";const s=String(v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function toCSV(rec){
  const cols=columns();
  Object.keys(rec).forEach(k=>{if(!cols.includes(k))cols.push(k)});
  return cols.map(csvCell).join(",")+"\n"+cols.map(k=>csvCell(rec[k])).join(",")+"\n";
}
function record(status,reason,minimal){
  const now=new Date();
  const r={trial_type:"survey_response",STUDY,MODE,RID,PID,STATUS:status,SCREENOUT_REASON:reason||"",START_TIME:new Date(S.t0).toISOString(),END_TIME:now.toISOString(),
    TOTAL_SEC:Math.round((now-S.t0)/1000),SCREEN_W:window.innerWidth,TEST:TEST?1:0};
  if(minimal==="none")return r;
  if(minimal==="cell"){["CONDITION","COND_SOURCE","GROUP","CELL","INTEG","PERS","BLOCK","PROFILE","ORDER"].forEach(k=>{if(S.emb[k]!==undefined)r[k]=S.emb[k]});return r}
  Object.assign(r,S.emb,S.ans);
  Object.keys(S.order).forEach(k=>{r["ORD_"+k]=S.order[k]});
  return r;
}

/* ================= sending ================= */
async function send(rec){
  const csv=toCSV(rec);
  S.lastCSV=csv;
  if(TEST)return {ok:true,test:true};
  if(!DP_ID)return {ok:false,err:"NO_EXPERIMENT_ID"};
  const filename=`S${DP_KEY}_${rec.STATUS}_${RID}.csv`;
  let last="NETWORK";
  for(let a=0;a<4;a++){
    try{
      const r=await fetch(API+"data/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"*/*"},body:JSON.stringify({experimentID:DP_ID,filename,data:csv})});
      if(r.status===201||r.status===202||r.ok)return {ok:true};
      const j=await r.json().catch(()=>({}));
      if(j.error==="FILE_EXISTS")return {ok:true};
      last=j.error||("HTTP_"+r.status);
      if(r.status===400)break;
    }catch(e){last="NETWORK"}
    await sleep(1200*(a+1));
  }
  return {ok:false,err:last};
}

let S={ans:{},emb:{},idx:0,order:{},t0:Date.now(),pageT:Date.now(),busy:false,finished:false},timerId=null;
function blocksOf(p){return (typeof p.blocks==="function"?p.blocks(S):p.blocks).filter(b=>!b.show||b.show(S))}
function rq(b,inner){return `<fieldset class="q" data-q="${esc(b.c||"")}"><legend>${fmt(S,b.t)}${b.c?code(b.c):""}</legend>${inner}<div class="emsg">Vui lòng trả lời câu này.</div></fieldset>`}
function pageKey(p){return p.tid?p.tid(S):p.id}
function renderBlock(b,p){
  const A=S.ans;
  switch(b.type){
  case "html":return typeof b.h==="function"?b.h(S):b.h;
  case "lik":{
    const lab=b.scale==="FREQ"?FREQ:LIK,n=lab.length;let items=b.items;
    if(b.shuffle!==false){const k=pageKey(p);if(!S.order[k])S.order[k]=shuffle(items.length).map(i=>items[i].c).join("|");const ord=S.order[k].split("|");items=ord.map(c=>b.items.find(x=>x.c===c)).filter(Boolean)}
    return items.map(it=>`<fieldset class="q" data-q="${it.c}"><legend>${fmt(S,it.t)}${code(it.c)}</legend><div class="scale n${n}" role="radiogroup">`+
      lab.map((l,i)=>`<label class="opt" for="${it.c}_${i+1}"><input type="radio" id="${it.c}_${i+1}" name="${it.c}" value="${i+1}"${A[it.c]===i+1?" checked":""}><span class="dot"></span><span class="lab">${l}</span><span class="num">${i+1}</span></label>`).join("")+
      `</div><div class="emsg">Vui lòng chọn một mức.</div></fieldset>`).join("");}
  case "single":{
    const opts=typeof b.opts==="function"?b.opts(S):b.opts;
    return rq(b,`<div class="list">`+opts.map(([v,l])=>{const id=`${b.c}_${v}`;const oth=b.other===v;
      return `<label class="li" for="${id}"><input type="radio" id="${id}" name="${b.c}" value="${v}"${A[b.c]===v?" checked":""}><span>${fmt(S,l)}</span>${oth?`<input type="text" class="othr" id="${b.c}_TEXT" name="${b.c}_TEXT" aria-label="Ghi rõ" maxlength="300" value="${esc(A[b.c+"_TEXT"]||"")}">`:""}</label>`}).join("")+`</div>`);}
  case "multi":{
    let opts=b.opts.slice();
    if(b.shuffle){const k=pageKey(p);if(!S.order[k])S.order[k]=shuffle(opts.length).map(i=>opts[i][0]).join("|");const ord=S.order[k].split("|").map(Number);opts=ord.map(v=>b.opts.find(o=>o[0]===v)).filter(Boolean)}
    const all=opts.concat(b.excl?[b.excl]:[]);
    return rq(b,`<div class="list">`+all.map(([v,l])=>{const id=`${b.c}_${v}`;return `<label class="li" for="${id}"><input type="checkbox" id="${id}" name="${id}" data-multi="${b.c}" data-excl="${b.excl&&b.excl[0]===v?1:0}"${A[id]===1?" checked":""}><span>${fmt(S,l)}</span></label>`}).join("")+`</div>`);}
  case "number":return rq(b,`<input class="num-in" type="number" inputmode="numeric" id="${b.c}" name="${b.c}" min="${b.min}" max="${b.max}" value="${A[b.c]??""}">`);
  case "text":return rq(b,`<textarea class="txt" id="${b.c}" name="${b.c}" maxlength="2000">${esc(A[b.c]||"")}</textarea>`);
  case "grid":{const rows=b.rows(S);
    return rq(b,`<div class="gridq"><table><thead><tr><th></th>${b.cols.map(([,l])=>`<th scope="col">${l}</th>`).join("")}</tr></thead><tbody>`+
      rows.map(([k,l])=>`<tr><th scope="row" style="font-weight:500">${l}${code(b.c+"_"+k)}</th>${b.cols.map(([v,cl])=>`<td><input type="radio" id="${b.c}_${k}_${v}" name="${b.c}_${k}" value="${v}" aria-label="${esc(cl)}"${A[b.c+"_"+k]===v?" checked":""}></td>`).join("")}</tr>`).join("")+`</tbody></table></div>`);}
  case "sd":return `<fieldset class="q" data-q="ATT"><legend>${fmt(S,b.t)}${code("ATT1–ATT3")}</legend><div style="display:grid;gap:14px">`+b.items.map(it=>
      `<div class="sd"><span class="l">${it.l}</span><span class="pts" role="radiogroup" aria-label="${esc(it.l+" – "+it.r)}">`+[1,2,3,4,5,6,7].map(v=>`<label class="pt" for="${it.c}_${v}"><input type="radio" id="${it.c}_${v}" name="${it.c}" value="${v}"${A[it.c]===v?" checked":""}>${v}</label>`).join("")+`</span><span class="r">${it.r}</span></div>`).join("")+`</div><div class="emsg">Vui lòng chọn một điểm cho mỗi dòng.</div></fieldset>`;
  }
  return "";
}
function shell(body,foot,pct){
  $("#main").innerHTML=`<div class="sheet"><div class="sh-top"><div class="org">${cfgv("ORG")} · Khảo sát nghiên cứu</div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div><div class="sh-body">${body}</div>${foot||""}</div>`;
  refit($("#main"));
}
function render(){
  clearInterval(timerId);
  const p=PAGES[S.idx];
  const pct=Math.round(S.idx/PAGES.length*100);
  const body=(TEST?`<div class="rnote">Trang ${S.idx+1}/${PAGES.length} · ${esc(pageKey(p))}</div>`:"")+blocksOf(p).map(b=>renderBlock(b,p)).join("");
  shell(body,`<div class="sh-foot"><span class="note" id="tnote"></span><button type="button" class="next" id="btnNext">Tiếp</button></div>`,pct);
  if(p.min){const end=S.pageT+p.min*1000,btn=$("#btnNext"),note=$("#tnote");
    const tick=()=>{const left=Math.ceil((end-Date.now())/1000);if(left>0){btn.disabled=true;note.textContent=`Nút Tiếp sẽ hiện sau ${left} giây.`}else{btn.disabled=false;note.textContent="";clearInterval(timerId)}};
    tick();timerId=setInterval(tick,250)}
}
function answered(c){return S.ans[c]!==undefined&&S.ans[c]!==null&&S.ans[c]!==""}
function validate(p){
  const bad=[];
  blocksOf(p).forEach(b=>{
    if(b.type==="lik")b.items.forEach(it=>{if(!answered(it.c))bad.push(it.c)});
    else if(b.type==="single"){if(!answered(b.c))bad.push(b.c);else if(b.other===S.ans[b.c]&&!b.otherOptional&&!String(S.ans[b.c+"_TEXT"]||"").trim())bad.push(b.c)}
    else if(b.type==="multi"){const vs=b.opts.map(o=>o[0]).concat(b.excl?[b.excl[0]]:[]);if(!vs.some(v=>S.ans[b.c+"_"+v]===1))bad.push(b.c)}
    else if(b.type==="number"){const v=S.ans[b.c];if(!(typeof v==="number"&&v>=b.min&&v<=b.max))bad.push(b.c)}
    else if(b.type==="text"){if(b.req&&String(S.ans[b.c]||"").trim().length<(b.min||1))bad.push(b.c)}
    else if(b.type==="grid"){if(b.rows(S).some(([k])=>!answered(b.c+"_"+k)))bad.push(b.c)}
    else if(b.type==="sd"){if(b.items.some(it=>!answered(it.c)))bad.push("ATT")}
  });
  document.querySelectorAll(".q.err").forEach(f=>f.classList.remove("err"));
  if(!bad.length)return true;
  let first=null;
  bad.forEach(c=>{const f=document.querySelector(`fieldset.q[data-q="${CSS.escape(c)}"]`);if(f){f.classList.add("err");if(!first)first=f;
    if(c==="REC2")f.querySelector(".emsg").textContent="Vui lòng mô tả ít nhất 10 ký tự.";
    if(c==="SC1")f.querySelector(".emsg").textContent="Vui lòng nhập tuổi (số từ 10 đến 99).";}});
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
  return false;
}
async function next(){
  if(S.busy)return;
  const p=PAGES[S.idx];
  if(p.min&&Date.now()<S.pageT+p.min*1000)return;
  if(!validate(p))return;
  S.busy=true;const btn=$("#btnNext");if(btn){btn.disabled=true}
  S.emb["T_"+pageKey(p)]=Math.round((Date.now()-S.pageT)/1000);
  let r=null;try{r=p.onNext?await p.onNext(S):null}catch(e){r=null}
  S.busy=false;
  if(r&&r.declined)return finish("declined","CONSENT_NO","none");
  if(r&&r.out)return finish("screenout",r.out,"screen");
  if(r&&r.quota)return finish("quotafull","QUOTA_FULL","screen");
  let i=S.idx+1;while(i<PAGES.length&&PAGES[i].show&&!PAGES[i].show(S))i++;
  if(i>=PAGES.length){
    if(STUDY!==1&&S.ans.WITHDRAW===0)return finish("withdrawn","","cell");
    return finish("complete","","full");
  }
  S.idx=i;S.pageT=Date.now();render();window.scrollTo(0,0);
}
async function finish(status,reason,level){
  S.finished=true;clearInterval(timerId);
  shell(`<div class="statusbox"><div class="spinner" aria-hidden="true"></div><p class="lead">Đang gửi câu trả lời của bạn, vui lòng không đóng trang…</p></div>`,"",100);
  let rec;
  if(level==="full")rec=record(status,reason);
  else if(level==="screen"){rec=record(status,reason,"none");["CONSENT","SC1","SC2","SC3","IMC","IMCQ"].forEach(k=>{if(S.ans[k]!==undefined)rec[k]=S.ans[k];if(S.emb[k]!==undefined)rec[k]=S.emb[k]});
    CHAINS.forEach(c=>{["SC2_","CH_"].forEach(p=>{if(S.ans[p+c.v]!==undefined)rec[p+c.v]=S.ans[p+c.v]})})}
  else rec=record(status,reason,level);
  const res=await send(rec);
  if(!res.ok)return failScreen(status,reason,level,res.err);
  if(!TEST){try{localStorage.setItem(DONE_KEY,status)}catch(e){}}
  done(status);
}
function failScreen(status,reason,level,err){
  shell(`<div class="statusbox"><h2 class="pt">Chưa gửi được câu trả lời</h2><p class="lead">Kết nối mạng có thể đang chập chờn. Câu trả lời của bạn vẫn còn trên trang này. Vui lòng kiểm tra mạng rồi bấm "Gửi lại".</p><button type="button" class="btn2" id="btnRetry">Gửi lại</button><p class="rnote" style="display:block">Mã lỗi: ${esc(err)}</p></div>`,"",100);
  $("#btnRetry").onclick=()=>finish(status,reason,level);
}
function done(status){
  const R=CFG.REDIRECT||{};
  const url=status==="complete"||status==="withdrawn"?R.complete:status==="quotafull"?(R.quotafull||R.screenout):R.screenout;
  const testInfo=TEST?`<p class="rnote" style="display:block">Chế độ thử: không gửi lên DataPipe. Đây là file CSV sẽ được lưu${url?"; link chuyển về panel: "+esc(url.replace("{PID}",PID)):""}.</p><pre class="csv">${esc(S.lastCSV||"")}</pre>`:"";
  if(url&&!TEST){location.href=url.replace(/\{PID\}/g,encodeURIComponent(PID));return}
  const code=String(CFG.COMPLETION_CODE||"").trim();
  let msg;
  if(status==="complete"||status==="withdrawn")msg=`<h2 class="pt">Cảm ơn bạn đã hoàn thành khảo sát!</h2><p class="lead">Câu trả lời của bạn đã được ghi lại.${code?` Mã hoàn thành của bạn: <b>${esc(code)}</b>.`:""} Nếu có thắc mắc, vui lòng liên hệ ${cfgv("RESEARCHER")}, ${cfgv("EMAIL")}.</p>`;
  else if(status==="declined")msg=`<h2 class="pt">Cảm ơn bạn.</h2><p class="lead">Bạn đã chọn không tham gia khảo sát.</p>`;
  else if(status==="quotafull")msg=`<h2 class="pt">Cảm ơn bạn đã dành thời gian!</h2><p class="lead">Khảo sát đã nhận đủ số người cho nhóm khách hàng của bạn.</p>`;
  else msg=`<h2 class="pt">Cảm ơn bạn đã dành thời gian!</h2><p class="lead">Khảo sát này dành cho một nhóm khách hàng khác.</p>`;
  shell(`<div class="statusbox">${msg}${testInfo}</div>`,"",100);
}

/* ================= events ================= */
document.addEventListener("click",e=>{const t=e.target.closest("button");if(t&&t.id==="btnNext")next()});
document.addEventListener("change",e=>{
  const t=e.target;if(!$("#main").contains(t))return;
  if(t.type==="radio")S.ans[t.name]=+t.value;
  else if(t.type==="checkbox"&&t.dataset.multi){
    S.ans[t.name]=t.checked?1:0;const box=t.closest(".list");
    if(t.checked)box.querySelectorAll('input[type="checkbox"]').forEach(o=>{if(o!==t&&(t.dataset.excl==="1"||o.dataset.excl==="1")){o.checked=false;S.ans[o.name]=0}});
    box.querySelectorAll('input[type="checkbox"]').forEach(o=>{if(S.ans[o.name]===undefined)S.ans[o.name]=o.checked?1:0});
  }else if(t.type==="number")S.ans[t.name]=t.value===""?undefined:+t.value;
  const f=t.closest(".q");if(f)f.classList.remove("err");
});
document.addEventListener("input",e=>{
  const t=e.target;if(!$("#main").contains(t))return;
  if(t.tagName==="TEXTAREA"||t.type==="text"){S.ans[t.name]=t.value;
    if(t.classList.contains("othr")){const base=t.name.replace(/_TEXT$/,"");document.querySelectorAll(`input[name="${base}"]`).forEach(r=>{if(r.closest("label").contains(t)){r.checked=true;S.ans[base]=+r.value}})}
    const f=t.closest(".q");if(f)f.classList.remove("err")}
  else if(t.type==="number")S.ans[t.name]=t.value===""?undefined:+t.value;
});
window.addEventListener("beforeunload",e=>{if(!S.finished&&S.idx>0&&!TEST){e.preventDefault();e.returnValue=""}});
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>refit(document),80)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>refit(document));

/* ================= boot ================= */
if(!PAGES.length){shell(`<div class="statusbox"><h2 class="pt">Link khảo sát chưa đúng</h2><p class="lead">Vui lòng kiểm tra lại đường link bạn nhận được.</p></div>`,"",0);return}
if(!TEST&&!DP_ID){shell(`<div class="statusbox"><h2 class="pt">Khảo sát chưa mở</h2><p class="lead">Khảo sát này chưa sẵn sàng nhận câu trả lời. Vui lòng quay lại sau.</p><p class="rnote" style="display:block">Thiếu mã DataPipe cho "${esc(DP_KEY)}" trong config.js.</p></div>`,"",0);return}
let doneBefore=null;try{doneBefore=localStorage.getItem(DONE_KEY)}catch(e){}
if(doneBefore&&!TEST){shell(`<div class="statusbox"><h2 class="pt">Bạn đã tham gia khảo sát này</h2><p class="lead">Thiết bị này đã gửi câu trả lời cho khảo sát. Cảm ơn bạn!</p></div>`,"",100);return}
render();
})();
</script>
</body>
</html>
