<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bảng hỏi Study 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a researcher toolbar band on top, then one centred survey sheet (max 760px) like a real survey platform page.
   The app mock-ups are fixed-colour "screenshots" so they look identical in both themes. */
:root{
  --bg:#ECF1F2; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#16232A; --muted:#56676F; --line:#D3DDE1;
  --accent:#1D5E77; --accent-ink:#FFFFFF; --accent-soft:#E0EDF2; --focus:#2C83A6;
  --danger:#A8291F; --danger-soft:#FBEAE7; --ok:#22704A;
  --ph-bg:#FFF1BF; --ph-ink:#5E4600;
  --bar:#18262D; --bar-2:#22343C; --bar-ink:#E7EEF0; --bar-muted:#9CB0B8; --bar-line:#33474F; --bar-accent:#7CC4DE;
  --app-brand:#5E3768; --app-bg:#F5F3F6; --app-card:#FFFFFF; --app-ink:#1E1A21; --app-muted:#6E6873; --app-line:#E5E0E7;
  --app-price:#B3361F; --app-info-bg:#ECEFF2; --app-info-ink:#353C43; --app-frame:#121416;
  --f-ui:"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1417; --surface:#162026; --surface-2:#1B2830; --ink:#E3EBEE; --muted:#98A9B1; --line:#2A3A42;
    --accent:#6DB5D1; --accent-ink:#0A1A20; --accent-soft:#1C3440; --focus:#8FD0E8;
    --danger:#F08A80; --danger-soft:#3A1E1B; --ok:#7FD0A6;
    --ph-bg:#4A3B0C; --ph-ink:#FFE38F;
    --bar:#0A1114; --bar-2:#132027; --bar-line:#24343B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#162026; --surface-2:#1B2830; --ink:#E3EBEE; --muted:#98A9B1; --line:#2A3A42;
  --accent:#6DB5D1; --accent-ink:#0A1A20; --accent-soft:#1C3440; --focus:#8FD0E8;
  --danger:#F08A80; --danger-soft:#3A1E1B; --ok:#7FD0A6;
  --ph-bg:#4A3B0C; --ph-ink:#FFE38F;
  --bar:#0A1114; --bar-2:#132027; --bar-line:#24343B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- researcher toolbar ---------- */
.rbar{background:var(--bar);color:var(--bar-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.rbar-in{max-width:1120px;margin:0 auto;display:grid;gap:10px}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.rtitle{font-weight:600;font-size:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-right:auto}
.rtitle small{font-weight:400;color:var(--bar-muted);font-size:12.5px}
.seg{display:inline-flex;background:var(--bar-2);border:1px solid var(--bar-line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--bar-muted);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--bar-muted)}
.fld select{background:var(--bar-2);color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:6px;padding:4px 6px;font-size:13px;max-width:62vw}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--bar-muted);cursor:pointer}
.tg input{accent-color:var(--bar-accent)}
.rbtn{background:transparent;border:1px solid var(--bar-line);color:var(--bar-ink);border-radius:6px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.rbtn:hover{border-color:var(--bar-muted)}
.chip{font-family:var(--f-code);font-size:11.5px;background:var(--bar-2);border:1px solid var(--bar-line);color:var(--bar-accent);padding:2px 8px;border-radius:999px}
.conds{display:contents}

/* ---------- survey sheet ---------- */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.sheet{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sh-top{padding:14px 22px 0;display:grid;gap:10px}
.org{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prog{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sh-body{padding:18px 22px 6px;display:grid;gap:18px}
.sh-foot{padding:14px 22px 20px;display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.sh-foot .note{font-size:13px;color:var(--muted);margin-right:auto}
.next{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 26px;font-weight:600;font-size:15px;cursor:pointer;min-width:120px}
.next[disabled]{opacity:.45;cursor:not-allowed}
h1.st{font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
h2.pt{font-size:16.5px;margin:0;text-wrap:balance}
.lead{margin:0}
.intro{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
.prose p{margin:0 0 10px}.prose p:last-child{margin-bottom:0}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.ph{background:var(--ph-bg);color:var(--ph-ink);border-radius:4px;padding:0 4px;font-weight:500;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.code{font-family:var(--f-code);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:8px;white-space:nowrap;vertical-align:1px}
body:not(.show-codes) .code{display:none}
.rnote{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
body:not(.show-codes) .rnote{display:none}

fieldset.q{border:0;margin:0;padding:0;min-width:0}
fieldset.q legend{padding:0;margin:0 0 10px;font-weight:500;width:100%}
.q + .q{border-top:1px dashed var(--line);padding-top:16px}
.q.err legend{color:var(--danger)}
.q .emsg{display:none;font-size:13px;color:var(--danger);margin-top:8px}
.q.err .emsg{display:block}

/* likert / frequency rows */
.scale{display:grid;gap:6px}
.scale.n7{grid-template-columns:repeat(7,minmax(0,1fr))}
.scale.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);font-size:12px;line-height:1.3;color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt:has(input:checked) .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 0 45%,transparent 50%)}
.opt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.opt .num{font-family:var(--f-code);font-size:11px}
@media (max-width:620px){
  .scale.n7,.scale.n5{grid-template-columns:1fr}
  .opt{flex-direction:row;justify-content:flex-start;text-align:left;padding:9px 12px;gap:10px;font-size:13.5px}
  .opt .num{order:3;margin-left:auto}
}
/* single / multi lists */
.list{display:grid;gap:6px}
.li{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.li input{margin-top:4px;accent-color:var(--accent)}
.li:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.li .othr{margin-left:auto;flex:1 1 140px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}
.li .sub{color:var(--muted);font-size:12.5px}
input.num-in,textarea.txt{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);width:100%}
input.num-in{max-width:140px}
textarea.txt{min-height:92px;resize:vertical}
/* grid question */
.gridq{overflow-x:auto}
.gridq table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.gridq th,.gridq td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
.gridq th:first-child,.gridq td:first-child{text-align:left}
.gridq thead th{font-weight:500;color:var(--muted);font-size:12.5px}
.gridq input{accent-color:var(--accent);width:18px;height:18px}
/* semantic differential */
.sd{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.sd .l{text-align:right}.sd .r{text-align:left}
.sd .pts{display:flex;gap:5px}
.sd .pt{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;cursor:pointer;font-family:var(--f-code);font-size:12px;color:var(--muted)}
.sd .pt input{position:absolute;opacity:0}
.sd .pt:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sd .pt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:620px){.sd{grid-template-columns:1fr 1fr}.sd .pts{grid-column:1/-1;grid-row:2;justify-content:space-between}.sd .l{text-align:left}.sd .r{text-align:right}.sd .pt{width:32px;height:32px}}

/* stimulus pages */
.scen{padding:16px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.scen .tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.scen p{margin:0 0 10px}.scen p:last-child{margin:0}
.stimwrap{display:grid;justify-items:center;gap:8px}
.thumbrow{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.thumbrow .cap{font-size:13px;color:var(--muted);min-width:0}
.thumbrow .pfit{flex:none}
.statusbox{display:grid;gap:12px;padding:6px 0}
.datatbl{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--f-code)}
.datatbl td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top;word-break:break-word}
.datatbl td:first-child{color:var(--muted);width:36%}
.datawrap{max-width:760px;margin:16px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.datawrap h3{margin:0 0 8px;font-size:14px}
.datascroll{max-height:360px;overflow:auto}
.btn2{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}

/* gallery */
.gal{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.gal-head{display:grid;gap:6px}
.gal-head h1{margin:0;font-size:20px}
.gal-head p{margin:0;color:var(--muted);max-width:70ch}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.gcard .fn{font-family:var(--f-code);font-size:12.5px;font-weight:500}
.gcard .use{font-size:12.5px;color:var(--muted)}
.gcard.wide{grid-column:span 2}
@media (max-width:640px){.gcard.wide{grid-column:auto}}

/* ---------- app mock-up (fixed colours: it is a screenshot) ---------- */
.pfit{position:relative;overflow:hidden;max-width:100%}
.pfit > .phone{position:absolute;top:0;left:0;transform-origin:0 0}
.phone{width:336px;height:585px;background:var(--app-frame);border-radius:40px;padding:8px;box-shadow:0 10px 30px rgba(10,20,30,.22)}
.scr{position:relative;width:320px;height:569px;border-radius:32px;overflow:hidden;background:var(--app-bg);color:var(--app-ink);font-family:var(--f-ui);font-size:12px;line-height:1.35}
.sbar{height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11px;font-weight:600;color:var(--app-ink)}
.sbar svg{display:block}
.ahd{height:46px;background:var(--app-brand);color:#fff;display:flex;align-items:center;gap:9px;padding:0 14px}
.ahd .lg{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--app-brand);display:grid;place-items:center;font-weight:700;font-size:15px}
.ahd .nm{font-weight:700;font-size:15px;letter-spacing:.01em}
.ahd .ct{margin-left:auto;display:block}
.srch{margin:8px 10px 0;height:34px;border-radius:9px;background:#fff;border:1px solid var(--app-line);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--app-muted);font-size:11.5px}
.chps{display:flex;gap:6px;padding:9px 10px 0;overflow:hidden}
.chps span{flex:none;background:#fff;border:1px solid var(--app-line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--app-ink)}
.hello{padding:10px 12px 0;font-weight:600;font-size:12.5px}
.sec{margin:8px 10px 0;background:var(--app-card);border-radius:12px;padding:10px;border:1px solid var(--app-line)}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sech b{font-size:14px}
.sech span{font-size:10.5px;color:var(--app-muted)}
.info{display:flex;gap:7px;align-items:flex-start;background:var(--app-info-bg);color:var(--app-info-ink);border-radius:8px;padding:7px 9px;margin-bottom:9px;font-size:11px;line-height:1.38}
.info svg{flex:none;margin-top:1px}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{display:flex;flex-direction:column;gap:3px}
.pc .im{border-radius:8px;overflow:hidden;aspect-ratio:1/1;background:#F4F1EC}
.pc .im svg{display:block;width:100%;height:100%}
.pc .n{font-size:11px;font-weight:500;line-height:1.3;min-height:43px}
.pc .qy{font-size:10px;color:var(--app-muted)}
.pc .pr{font-size:12.5px;font-weight:700;color:var(--app-price)}
.pc .ad{margin-top:3px;border:1px solid var(--app-brand);color:var(--app-brand);border-radius:6px;text-align:center;font-size:10.5px;font-weight:600;padding:3px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:10.5px}
.cats i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 4px;border-radius:12px;background:#F1ECF2}
.bnav{position:absolute;left:0;right:0;bottom:0;height:54px;background:#fff;border-top:1px solid var(--app-line);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font-size:9.5px;color:var(--app-muted);padding-bottom:6px}
.bnav div{display:grid;justify-items:center;gap:2px}
.bnav .on{color:var(--app-brand);font-weight:600}
/* recall mock */
.rhd{height:44px;background:#E9ECEF;display:flex;align-items:center;gap:10px;padding:0 14px;color:#5B636B}
.rph{background:#E3E6EA;border-radius:4px;height:8px}
.msg{margin:10px 10px 0;background:var(--app-card);border:1px solid var(--app-line);border-radius:12px;padding:10px}
.msg .mh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;margin-bottom:8px}
.msg .av{width:26px;height:26px;border-radius:50%;background:#D9DDE2}
.bub{background:#EEF1F4;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:11.5px;line-height:1.4}
.illu{position:absolute;top:30px;right:12px;background:rgba(20,24,28,.72);color:#fff;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
/* K2 card */
.k2{width:460px;max-width:100%;background:#fff;color:#1E1A21;border:1px solid #E1DCE3;border-radius:14px;padding:18px 18px 8px;font-family:var(--f-ui)}
.k2 .k2h{font-weight:700;font-size:16px;color:#5E3768;margin-bottom:6px;line-height:1.3}
.k2 .row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid #EEE9F0}
.k2 .row:first-of-type{border-top:0}
.k2 .ic{flex:none;width:42px;height:42px;border-radius:12px;background:#F3EEF5;display:grid;place-items:center;color:#5E3768}
.k2 .lb{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#7A7280;margin-bottom:2px}
.k2 .tx{font-size:14.5px;line-height:1.45}
html.export-mode,html.export-mode body{background:transparent}
.export .gal-grid{grid-template-columns:repeat(2,520px)}
.export .gcard,.export .gcard.wide{background:transparent;border:0;grid-column:auto}
.export .shot .phone{box-shadow:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="rbar" aria-label="Thanh công cụ xem trước">
  <div class="rbar-in">
    <div class="rrow">
      <div class="rtitle">Bản xem trước bảng hỏi Study 2 <small>Thanh này chỉ dành cho nhóm nghiên cứu; người trả lời không thấy.</small></div>
      <div class="seg" id="viewSeg" role="group" aria-label="Chế độ xem">
        <button type="button" id="vSurvey" data-view="survey" aria-pressed="true">Bảng hỏi</button>
        <button type="button" id="vGallery" data-view="gallery" aria-pressed="false">Ảnh kích thích</button>
      </div>
    </div>
    <div class="rrow" id="ctlRow">
      <span class="chip" aria-label="Nghiên cứu đang xem">STUDY 2 · THÍ NGHIỆM 2 × 2</span>

      <label class="fld" for="selJump">Đi tới <select id="selJump"></select></label>
    </div>
    <div class="rrow" id="optRow">
      <label class="tg" for="tgCodes"><input type="checkbox" id="tgCodes"> Hiện mã biến</label>
      <label class="tg" for="tgTimer"><input type="checkbox" id="tgTimer"> Bỏ đếm giờ</label>
      <label class="tg" for="tgSkip"><input type="checkbox" id="tgSkip"> Cho bỏ trống</label>
      <label class="tg" for="tgShuffle"><input type="checkbox" id="tgShuffle" checked> Xáo thứ tự item</label>
      <button type="button" class="rbtn" id="btnData">Xem dữ liệu ghi được</button>
      <button type="button" class="rbtn" id="btnReset">Làm lại từ đầu</button>
      <span class="chip" id="cellChip" hidden></span>

  </div>

<main id="main"></main>

<!-- Study configuration: keep config.js beside index.html on GitHub Pages. -->
<script src="./config.js"></script>
<style id="participant-production-overrides">
  /* Hide research-only preview controls in the public participant version. */
  .rbar { display: none !important; }
  .datawrap { display: none !important; }
</style>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chainOf(s){return CHAINS.find(c=>c.v===s.emb.RETAILER)}
function fmt(s,t){
  const ch=chainOf(s);
  const A=ch?`<span class="ph">${ch.name}</span>`:`<span class="ph">[Chuỗi A]</span>`;
  const NH=ch?CATS[ch.cat].nh:`<span class="ph">[ngành hàng]</span>`;
  return String(t).replace(/\{A\}/g,A).replace(/\{NH\}/g,NH).replace(/\[\[(.+?)\]\]/g,'<span class="ph">[$1]</span>');
}

function art(k){

  const carton=(body,top,cap,band,bandTxt1,bandTxt2,small,smallFill)=>
    `<path d="M32 31 L50 15 L68 31 Z" fill="${top}"/><rect x="45.5" y="10" width="9" height="7" rx="1.5" fill="${cap}"/>`+
    `<path d="M32 31 H68 V88 Q68 91 65 91 H35 Q32 91 32 88 Z" fill="${body}" stroke="rgba(0,0,0,.08)"/>`+
    T(50,41,4.6,smallFill,small,600)+`<rect x="32" y="46" width="36" height="20" fill="${band}"/>`+T(50,54.5,5.6,"#fff",bandTxt1)+T(50,62.5,5.6,"#fff",bandTxt2);
  const bag=(loaf,crust,band,txt)=>
    `<rect x="16" y="34" width="68" height="50" rx="12" fill="#ECE6DA" stroke="rgba(0,0,0,.07)"/><rect x="82" y="52" width="7" height="10" rx="2.5" fill="#C9BFAE"/>`+
    `<path d="M23 77 V53 Q23 41 36 41 H64 Q77 41 77 53 V77 Z" fill="${loaf}" stroke="${crust}" stroke-width="2"/>`+
    `<rect x="16" y="62" width="68" height="12" fill="${band}"/>`+T(50,70.3,5.2,"#fff",txt);
  const bg=`<rect width="100" height="100" fill="#F4F1EC"/>`;
  const svg=b=>`<svg viewBox="0 0 100 100" role="img" aria-hidden="true">${bg}${b}</svg>`;
  switch(k){
    case "almond": return svg(carton("#F2E7D3","#E3D3B7","#C7AD86","#7C5333","SỮA","HẠNH NHÂN","KHÔNG ĐƯỜNG","#7C5333")+`<ellipse cx="50" cy="78" rx="4.6" ry="7.6" transform="rotate(28 50 78)" fill="#B57B4B"/><ellipse cx="57" cy="80" rx="3.6" ry="6" transform="rotate(-20 57 80)" fill="#9C653A"/>`);
    case "milk": return svg(carton("#FFFFFF","#E8EEF4","#9DB6D3","#2F6CB2","SỮA TƯƠI","TIỆT TRÙNG","1 LÍT","#2F6CB2")+`<path d="M50 70 C46.5 75.5 45 78.5 45 81 A5 5 0 0 0 55 81 C55 78.5 53.5 75.5 50 70 Z" fill="#7FA8D8"/>`);
    case "oats": return svg(`<path d="M30 20 Q30 15 35 15 H65 Q70 15 70 20 L73 87 Q73 91 69 91 H31 Q27 91 27 87 Z" fill="#E5D19D" stroke="rgba(0,0,0,.07)"/><rect x="30" y="15" width="40" height="5" fill="#CDB476"/>`+T(50,33,6,"#5A4420","YẾN MẠCH")+T(50,40,4.2,"#7A6334","NGUYÊN CHẤT",600)+`<ellipse cx="50" cy="63" rx="15.5" ry="13.5" fill="#F6ECD1"/>`+[[44,58],[51,56],[57,60],[46,65],[53,64],[59,67],[42,69],[49,71],[56,72]].map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="3" ry="1.9" transform="rotate(${(i*37)%90-45} ${x} ${y})" fill="#D2B672"/>`).join(""));
    case "cereal": return svg(`<rect x="30" y="12" width="40" height="78" rx="2" fill="#E3982D"/><rect x="30" y="12" width="40" height="5" fill="#C67E1B"/>`+T(50,28,6.4,"#fff","NGŨ CỐC")+T(50,35,4.2,"#FFF3DB","ĂN SÁNG",600)+[[41,57],[46,54],[52,55],[58,57],[44,60],[50,59],[56,61]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#F7CA6A" stroke="#D49A34" stroke-width=".8"/>`).join("")+`<path d="M36 61 H64 Q63 76 50 77 Q37 76 36 61 Z" fill="#fff"/>`);
    case "wgbread": return svg(bag("#8E5A2E","#6E4220","#3E6A3A","NGUYÊN CÁM")+[[34,48],[42,46],[50,49],[58,46],[66,49],[38,54],[62,55]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.6" ry="1" fill="#D0A26C"/>`).join(""));

/* ================= stimulus renderers ================= */
function phone(inner){return `<div class="phone"><div class="scr">${inner}</div></div>`}
function statusBar(){return `<div class="sbar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">${ICON.wifi}${ICON.batt}</span></div>`}
function bottomNav(){return `<div class="bnav"><div class="on">${ICON.home}Trang chủ</div><div>${ICON.grid}Danh mục</div><div>${ICON.cart2}Giỏ hàng</div><div>${ICON.user}Tài khoản</div></div>`}
function appScreen(o){ /* o = {list:'X'|'Y', goiy:bool, block:bool} */
  const title=o.goiy?"Gợi ý cho bạn":"Đồ ăn sáng bán chạy tuần này";
  const cards=PRODUCTS[o.list].map((p,i)=>`<div class="pc"><div class="im">${art(p.k)}</div><div class="n">${p.n}</div><div class="qy">${p.q}</div><div class="pr">${PRICES[i]}</div><div class="ad">Thêm vào giỏ</div></div>`).join("");
  return phone(statusBar()+
    `<div class="ahd"><span class="lg">A</span><span class="nm">Chuỗi A</span><span class="ct">${ICON.cart}</span></div>`+
    `<div class="srch">${ICON.search}<span>Tìm sản phẩm…</span></div>`+
    `<div class="chps"><span>Rau củ</span><span>Sữa</span><span>Đồ khô</span><span>Đồ uống</span><span>Gia vị</span></div>`+
    `<div class="hello">Chào buổi sáng!</div>`+
    `<div class="sec"><div class="sech"><b>${title}</b><span>Xem tất cả ›</span></div>`+
    (o.block?`<div class="info">${ICON.info}<span>${BLOCK_LINE}</span></div>`:"")+
    `<div class="pg">${cards}</div></div>`+
    `<div class="sec"><div class="sech"><b>Danh mục</b><span>Xem tất cả ›</span></div><div class="cats"><div><i>${ICON.leaf}</i>Rau củ</div><div><i>${ICON.fish}</i>Thịt cá</div><div><i>${ICON.grain}</i>Đồ khô</div><div><i>${ICON.cup}</i>Đồ uống</div></div></div>`+
    bottomNav());
}

function fit(html,max){return `<div class="pfit" data-max="${max}">${html}</div>`}
function refit(root=document){
  root.querySelectorAll(".pfit").forEach(w=>{
    const ph=w.firstElementChild;if(!ph)return;
    const max=+w.dataset.max||336;const avail=w.parentElement.clientWidth||max;
    const width=Math.min(max,avail);const sc=width/336;
    ph.style.transform=`scale(${sc})`;w.style.width=width+"px";w.style.height=(585*sc)+"px";
  });
}
function screenFor(s){ /* which app screen this respondent sees */
  const prof=s.emb.PROFILE??0, own=prof===0?"X":"Y", other=prof===0?"Y":"X";
  if(s.study===2){const hi=(s.emb.PERS??1)===1;return {list:hi?own:other,goiy:hi,block:false}}
  return {list:own,goiy:true,block:(s.emb.BLOCK??0)===1};
}

const CONSENT1=`<div class="prose"><h1 class="st">Khảo sát về trải nghiệm mua sắm và gợi ý sản phẩm tại các chuỗi bán lẻ</h1>
<p style="margin-top:12px">Xin chào! Chúng tôi là nhóm nghiên cứu của [[Tên trường/viện]]. Khảo sát tìm hiểu trải nghiệm của khách khi mua sắm ở các chuỗi bán lẻ qua cả cửa hàng và app, và cảm nhận của khách về các gợi ý sản phẩm, ưu đãi mà chuỗi gửi.</p>
<ul><li>Thời gian: khoảng 15 phút.</li><li>Tham gia là tự nguyện. Bạn có thể dừng bất cứ lúc nào mà không cần giải thích. [[Quy định thù lao khi dừng giữa chừng, theo panel]]</li><li>Khảo sát không hỏi họ tên, số điện thoại, email hay mã thành viên của bạn. Câu trả lời chỉ dùng cho nghiên cứu, được phân tích ở dạng tổng hợp, lưu trữ an toàn trong [[thời gian lưu trữ]] rồi xóa.</li><li>Không có câu trả lời đúng hay sai. Hãy trả lời theo trải nghiệm thật của bạn.</li><li>Khảo sát không có rủi ro đáng kể. Nếu thấy câu hỏi nào không thoải mái, bạn có thể dừng.</li><li>Thù lao: [[mức và hình thức]].</li><li>Nghiên cứu đã được [[Hội đồng đạo đức]] phê duyệt, số [[ ]]. Thắc mắc xin liên hệ Lê Phước Bằng (lephuocbang.st@tdtu.edu.vn).</li></ul></div>`;
const CONSENT23=`<div class="prose"><h1 class="st">Khảo sát về cách khách hàng nhìn nhận gợi ý sản phẩm trên app bán lẻ</h1>
<p style="margin-top:12px">Xin chào! Tôi là Lê Phước Bằng, học viên tại Trường Đại học Tôn Đức Thắng. Khảo sát này tìm hiểu cách khách hàng cảm nhận về gợi ý sản phẩm trên app bán lẻ. Bạn sẽ đọc một tình huống mua sắm giả định, xem một màn hình app, rồi trả lời một số câu hỏi.</p>

/* ================= Studies 2 & 3 ================= */
const STUDY2_LOCK_KEY = "study2_participation_" + ((window.STUDY_CONFIG && window.STUDY_CONFIG.experimentID) || "unknown");
function readStudy2Lock(){try{return JSON.parse(localStorage.getItem(STUDY2_LOCK_KEY)||"null")}catch(_){return null}}
function writeStudy2Lock(value){try{localStorage.setItem(STUDY2_LOCK_KEY,JSON.stringify(value));return true}catch(_){return false}}
async function assign(s){
  // DataPipe returns condition indices 0..7 in sequence when the dashboard's
  // "Assign conditions in sequence" option is ON and set to 8 conditions.
  // Each pair is one INTEG x PERS cell, split evenly across profiles X and Y.
  const config = window.STUDY_CONFIG;
  if (!config || !config.experimentID || !config.conditionEndpoint) {
    throw new Error("Missing DataPipe condition settings in config.js");
  }
  const response = await fetch(config.conditionEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ experimentID: config.experimentID })
  });
  let body = {};
  try { body = await response.json(); } catch (_) {}
  const condition = Number(body.condition);
  if (!response.ok || !Number.isInteger(condition) || condition < 0 || condition > 7) {
    throw new Error(body.error || body.message || `Condition assignment failed (HTTP ${response.status})`);
  }

  const mainCell = Math.floor(condition / 2); // 0..3 for INTEG x PERS
  s.emb.INTEG = Math.floor(mainCell / 2);    // 0 = low, 1 = high
  s.emb.PERS = mainCell % 2;                 // 0 = low, 1 = high
  s.emb.PROFILE = condition % 2;             // 0 = profile X, 1 = profile Y
  s.emb.CONDITION_INDEX = condition;         // DataPipe's 0-based condition number
  s.emb.ORDER = 2;                           // Prespecified order: CRP before PPV
  cellUpdate(s);
  if(s.study===2){
    s.submissionId = s.submissionId || study2ParticipantId();
    writeStudy2Lock({status:"started",participant_id:s.submissionId,condition:condition,at:new Date().toISOString()});
  }
}
function cellUpdate(s){
  if(s.emb.INTEG==null)return;
  const g=s.emb.INTEG*2+(s.study===2?s.emb.PERS:s.emb.BLOCK)+1;
  s.emb.GROUP=g;
  // Study 2 records four main INTEG x PERS groups and eight cells after balancing profile X/Y.
  s.emb.CELL=s.study===2?g:(g-1)*2+s.emb.PROFILE+1;
}

  return seq;

/* ================= renderers ================= */
function blocksOf(p){return (typeof p.blocks==="function"?p.blocks(S):p.blocks).filter(b=>!b.show||b.show(S))}
function rq(b,inner,cls=""){return `<fieldset class="q ${cls}" data-q="${esc(b.c||"")}"><legend>${fmt(S,b.t)}${b.c?code(b.c):""}</legend>${inner}<div class="emsg">Vui lòng trả lời câu này.</div></fieldset>`}
function renderBlock(b,key){
  const A=S.ans;
  switch(b.type){
  case "html": return typeof b.h==="function"?b.h(S):b.h;
  case "lik":{
    const lab=b.scale==="FREQ"?FREQ:LIK,n=lab.length;
    let items=b.items;
    if(S.flags.shuffle&&b.shuffle!==false){if(!S.order[key]||S.order[key].length!==items.length)S.order[key]=shuffle(items.length);items=S.order[key].map(i=>b.items[i])}
    return items.map(it=>`<fieldset class="q" data-q="${it.c}"><legend>${fmt(S,it.t)}${code(it.c)}</legend><div class="scale n${n}" role="radiogroup">`+
      lab.map((l,i)=>`<label class="opt" for="${it.c}_${i+1}"><input type="radio" id="${it.c}_${i+1}" name="${it.c}" value="${i+1}"${A[it.c]===i+1?" checked":""}><span class="dot"></span><span class="lab">${l}</span><span class="num">${i+1}</span></label>`).join("")+
      `</div><div class="emsg">Vui lòng chọn một mức.</div></fieldset>`).join("");}
  case "single":{
    const opts=typeof b.opts==="function"?b.opts(S):b.opts;
    return rq(b,`<div class="list">`+opts.map(([v,l])=>{const id=`${b.c}_${v}`;const oth=b.other===v;
      return `<label class="li" for="${id}"><input type="radio" id="${id}" name="${b.c}" value="${v}"${A[b.c]===v?" checked":""}><span>${fmt(S,l)}</span>${oth?`<input type="text" class="othr" id="${b.c}_TEXT" name="${b.c}_TEXT" aria-label="Ghi rõ" value="${esc(A[b.c+"_TEXT"]||"")}">`:""}</label>`}).join("")+`</div>`);}
  case "multi":{
    let opts=b.opts.slice();
    if(b.shuffle&&S.flags.shuffle){if(!S.order[key])S.order[key]=shuffle(opts.length);opts=S.order[key].map(i=>b.opts[i])}
    const all=opts.concat(b.excl?[b.excl]:[]);
    return rq(b,`<div class="list">`+all.map(([v,l])=>{const id=`${b.c}_${v}`;return `<label class="li" for="${id}"><input type="checkbox" id="${id}" name="${id}" data-multi="${b.c}" data-excl="${b.excl&&b.excl[0]===v?1:0}"${A[id]===1?" checked":""}><span>${fmt(S,l)}</span></label>`}).join("")+`</div>`);}
  case "number": return rq(b,`<input class="num-in" type="number" inputmode="numeric" id="${b.c}" name="${b.c}" min="${b.min}" max="${b.max}" value="${A[b.c]??""}">`);
  case "text": return rq(b,`<textarea class="txt" id="${b.c}" name="${b.c}">${esc(A[b.c]||"")}</textarea>`);
  case "grid":{
    const rows=b.rows(S);
    return rq(b,`<div class="gridq"><table><thead><tr><th></th>${b.cols.map(([,l])=>`<th scope="col">${l}</th>`).join("")}</tr></thead><tbody>`+
      rows.map(([k,l])=>`<tr><th scope="row" style="font-weight:500">${l}${code(b.c+"_"+k)}</th>${b.cols.map(([v,cl])=>`<td><input type="radio" id="${b.c}_${k}_${v}" name="${b.c}_${k}" value="${v}" aria-label="${esc(cl)}"${A[b.c+"_"+k]===v?" checked":""}></td>`).join("")}</tr>`).join("")+`</tbody></table></div>`);}
  case "sd":
    return `<fieldset class="q" data-q="ATT"><legend>${fmt(S,b.t)}${code("ATT1–ATT3")}</legend><div style="display:grid;gap:14px">`+b.items.map(it=>
      `<div class="sd" data-q="${it.c}"><span class="l">${it.l}</span><span class="pts" role="radiogroup" aria-label="${esc(it.l+" – "+it.r)}">`+
      [1,2,3,4,5,6,7].map(v=>`<label class="pt" for="${it.c}_${v}"><input type="radio" id="${it.c}_${v}" name="${it.c}" value="${v}"${A[it.c]===v?" checked":""}>${v}</label>`).join("")+`</span><span class="r">${it.r}</span></div>`).join("")+`</div><div class="emsg">Vui lòng chọn một điểm cho mỗi dòng.</div></fieldset>`;
  }
  return "";
}

/* ================= validation & navigation ================= */
function answered(c){return S.ans[c]!==undefined&&S.ans[c]!==null&&S.ans[c]!==""}
function validate(p){
  if(S.flags.allowSkip)return true;
  const bad=[];
  blocksOf(p).forEach(b=>{
    if(b.type==="lik"){b.items.forEach(it=>{if(!answered(it.c))bad.push(it.c)})}
    else if(b.type==="single"){if(!answered(b.c))bad.push(b.c);else if(b.other===S.ans[b.c]&&!b.otherOptional&&!String(S.ans[b.c+"_TEXT"]||"").trim())bad.push(b.c)}
    else if(b.type==="multi"){const vs=b.opts.map(o=>o[0]).concat(b.excl?[b.excl[0]]:[]);if(!vs.some(v=>S.ans[b.c+"_"+v]===1))bad.push(b.c)}
    else if(b.type==="number"){const v=S.ans[b.c];if(!(typeof v==="number"&&v>=b.min&&v<=b.max))bad.push(b.c)}
    else if(b.type==="text"){if(b.req&&String(S.ans[b.c]||"").trim().length<(b.min||1))bad.push(b.c)}
    else if(b.type==="grid"){if(b.rows(S).some(([k])=>!answered(b.c+"_"+k)))bad.push(b.c)}
    else if(b.type==="sd"){if(b.items.some(it=>!answered(it.c)))bad.push("ATT")}
  });
  document.querySelectorAll(".q.err").forEach(f=>f.classList.remove("err"));
  if(!bad.length)return true;
  let first=null;
  bad.forEach(c=>{const f=document.querySelector(`fieldset.q[data-q="${CSS.escape(c)}"]`);if(f){f.classList.add("err");if(!first)first=f}
    if(c==="REC2"&&f)f.querySelector(".emsg").textContent="Vui lòng mô tả ít nhất 10 ký tự.";
    if(c==="SC1"&&f)f.querySelector(".emsg").textContent="Vui lòng nhập tuổi (số từ 10 đến 99).";});
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
  return false;
}

function study2ParticipantId(){

      return window.crypto.randomUUID().replace(/-/g, "");
    }

  return Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
function csvEscape(value){
  if (value === undefined || value === null) return "";
  const text = (typeof value === "object") ? JSON.stringify(value) : String(value);
  return '"' + text.replace(/"/g, '""') + '"';
}

  const headers = Object.keys(record).concat(answerColumns, extras);
  const values = headers.map(k => {
    if (Object.prototype.hasOwnProperty.call(S.ans, k)) return S.ans[k];
    return record[k];
  });
  S.submissionFilename = `study2_${participantId}_${trialType}.csv`;
  S.submissionCsv = headers.map(csvEscape).join(",") + "\r\n" + values.map(csvEscape).join(",") + "\r\n";
  return { filename: S.submissionFilename, data: S.submissionCsv };
}
async function submitStudy2Partial(trialType){
  if(!S || S.study!==2 || S.partialUploadState==="sending" || S.partialUploadState==="saved") return;
  S.partialUploadState="sending";
  renderSurvey();
  try{
    const config=window.STUDY_CONFIG;
    if(!config || !config.experimentID || !config.dataEndpoint) throw new Error("Missing DataPipe settings in config.js");
    const csv=createStudy2Csv(trialType);
    const response=await fetch(config.dataEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({experimentID:config.experimentID,filename:csv.filename,data:csv.data})});
    let body={};try{body=await response.json()}catch(_){}
    if(response.status===201 || response.status===202){S.partialUploadState="saved";writeStudy2Lock({status:"imc_failed",participant_id:S.submissionId,condition:S.emb.CONDITION_INDEX,at:new Date().toISOString()});}
    else throw new Error(body.error || `HTTP_${response.status}`);
  }catch(error){console.error("Study 2 partial DataPipe upload failed:",error);S.partialUploadState="error";S.partialUploadError=String(error&&error.message?error.message:error);}
  renderSurvey();
}
async function submitCompletedStudy2(){
  if (!S || !S.status || S.status.kind !== "end" || S.ans.WITHDRAW === 0) return;
  if (S.uploadState === "sending" || S.uploadState === "saved") return;
  S.uploadState = "sending";
  renderSurvey();
  try {
    const config = window.STUDY_CONFIG;
    if (!config || !config.experimentID || !config.dataEndpoint) {
      throw new Error("Missing DataPipe settings in config.js");
    }
    const csv = createStudy2Csv();
    const response = await fetch(config.dataEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        experimentID: config.experimentID,
        filename: csv.filename,
        data: csv.data
      })
    });
    let body = {};
    try { body = await response.json(); } catch (_) {}
    // HTTP 201 = stored; 202 = accepted and queued. FILE_EXISTS on a retry
    // with this same randomly unique filename means the first submission arrived.
    if (response.status === 201 || response.status === 202 || body.error === "FILE_EXISTS") {
      S.uploadState = "saved";
      S.uploadMessage = response.status === 202 ? "queued" : "stored";
      writeStudy2Lock({status:"completed",participant_id:S.submissionId,condition:S.emb.CONDITION_INDEX,at:new Date().toISOString()});
    } else {
      const code = body.error || `HTTP_${response.status}`;
      throw new Error(code);
    }
  } catch (error) {
    console.error("Study 2 DataPipe upload failed:", error);
    S.uploadState = "error";
    S.uploadError = String(error && error.message ? error.message : error);
  }
  renderSurvey();
}

async function next(){
  if (S.busy) return;
  const pages=pagesOf(),p=pages[S.idx];
  if(p.min&&!S.flags.noTimer&&Date.now()<S.pageT+p.min*1000)return;
  if(!validate(p))return;
  if(p.tcode)S.emb[p.tcode]=Math.round((Date.now()-S.pageT)/1000);
  S.busy = true;
  const nextButton = $("#btnNext");
  if (nextButton) { nextButton.disabled = true; nextButton.textContent = "Đang xử lý…"; }
  let r = null;
  try {
    r = p.onNext ? await p.onNext(S) : null;
  } catch (error) {
    console.error("Study 2 condition assignment failed:", error);
    S.busy = false;
    S.status = { kind: "assignment_error" };
    S.assignmentError = String(error && error.message ? error.message : error);
    return go();
  }
  S.busy = false;
  if(r&&r.declined){S.status={kind:"declined"};return go()}
  if(r&&r.out){
    S.status={kind:"screenout",msg:r.out};
    if(S.study===2 && p.id==="imc" && S.emb.IMC===0){
      if(!S.submissionId)S.submissionId=study2ParticipantId();
      writeStudy2Lock({status:"imc_failed",participant_id:S.submissionId,condition:S.emb.CONDITION_INDEX,at:new Date().toISOString()});
      go();
      submitStudy2Partial("study2_imc_failed");
      return;
    }
    return go();
  }
  let i=S.idx+1;while(i<pages.length&&pages[i].show&&!pages[i].show(S))i++;
  if(i>=pages.length){
    S.status={kind:"end"};
    S.uploadState = S.ans.WITHDRAW === 0 ? "not-consented" : "ready";
  }else S.idx=i;
  go();
  // Only upload completed surveys after the participant confirms consent at debrief.
  if(S.status && S.status.kind === "end" && S.ans.WITHDRAW !== 0) submitCompletedStudy2();
}
function go(){S.pageT=Date.now();renderSurvey();syncJump();const m=$("#main");if(m)window.scrollTo({top:m.offsetTop-8,behavior:"auto"})}

/* ================= toolbar ================= */
function syncJump(){
  const sel=$("#selJump");
  sel.innerHTML=pagesOf().map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.label)}</option>`).join("")+`<option value="end">Trang kết thúc</option>`;
  sel.value=S.status?(S.status.kind==="end"?"end":""):String(S.idx);
}
function condSelect(id,label,key,opts){
  return `<label class="fld" for="${id}">${label} <select id="${id}" data-cond="${key}">${opts.map(([v,l])=>`<option value="${v}"${S.cond[key]===v?" selected":""}>${l}</option>`).join("")}</select></label>`;
}
function renderConds(){
  const box=$("#condBox");
  if(S.study===1){box.innerHTML="";return}
  const R=["r","Ngẫu nhiên"];
  box.innerHTML=condSelect("cInteg","Tích hợp","INTEG",[R,["0","Thấp"],["1","Cao"]])+
    (S.study===2
      ?condSelect("cPers","Cá nhân hóa","PERS",[R,["0","Thấp"],["1","Cao"]])
      :condSelect("cBlock","Dòng nêu nguồn","BLOCK",[R,["0","Không nêu"],["1","Nêu rõ"]])+condSelect("cProf","Hồ sơ","PROFILE",[R,["0","X"],["1","Y"]])+condSelect("cOrder","Thứ tự","ORDER",[R,["1","PPV trước"],["2","CRP trước"]]));
}
function updateChips(){
  const chip=$("#cellChip");
  if(S.study===1){chip.hidden=!S.emb.RETAILER;if(S.emb.RETAILER)chip.textContent=`RETAILER = ${S.emb.RETAILER} · CATEGORY = ${S.emb.CATEGORY}`;return}
  if(S.emb.INTEG==null){chip.hidden=false;chip.textContent="Chưa chia nhóm";return}
  chip.hidden=false;
  chip.textContent=S.study===2
    ?`Nhóm ${S.emb.GROUP}/4 · INTEG ${S.emb.INTEG} · PERS ${S.emb.PERS} · hồ sơ cố định X · ORDER CRP→PPV`
    :`Nhóm ${S.emb.GROUP} · ô ${S.emb.CELL} · INTEG ${S.emb.INTEG} · BLOCK ${S.emb.BLOCK} · PROFILE ${S.emb.PROFILE} · ORDER ${S.emb.ORDER}`;
}
function setStudy(n){
  S=newState(n,S);
  document.querySelectorAll("#studySeg button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.study===n)));
  renderConds();syncJump();if(view==="survey")renderSurvey();
}
function setView(v){
  view=v;
  document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===v)));
  $("#ctlRow").hidden=v!=="survey";$("#optRow").hidden=v!=="survey";
  if(v==="survey")renderSurvey();else renderGallery();
}
function renderGallery(exportMode){
  clearInterval(timerId);
  const G=[
    ["IMG_GOIY_X",appScreen({list:"X",goiy:true}),"Study 2 · Cá nhân hóa cao: sản phẩm phù hợp với hồ sơ X."],
    ["IMG_BANCHAY_Y",appScreen({list:"Y",goiy:false}),"Study 2 · Cá nhân hóa thấp: danh sách đồ ăn sáng bán chạy."]
  ];
  const cards=G.map(([n,h,u])=>`<figure class="gcard" id="g-${n}" style="margin:0"><div class="stimwrap">${exportMode?`<div class="shot" id="shot-${n}">${h}</div>`:fit(h,300)}</div><figcaption><div class="fn">${n}.png</div><div class="use">${u}</div></figcaption></figure>`).join("");
  const k2=[["K2_THAP",k2Card(0),"Study 2 · Tích hợp dịch vụ thấp."],["K2_CAO",k2Card(1),"Study 2 · Tích hợp dịch vụ cao."]]
    .map(([n,h,u])=>`<figure class="gcard wide" style="margin:0"><div class="stimwrap"><div class="shot" id="shot-${n}" style="max-width:100%">${h}</div></div><figcaption><div class="fn">${n}.png</div><div class="use">${u}</div></figcaption></figure>`).join("");
  $("#main").innerHTML=`<div class="gal${exportMode?" export":""}"><div class="gal-head"><h1>Ảnh kích thích · Study 2</h1><p>Chỉ gồm các ảnh dùng trong thí nghiệm Study 2. Thương hiệu, bao bì và sản phẩm đều là hình minh họa. Giá cần được pretest để bảo đảm tương đương giữa hai danh sách.</p></div><div class="gal-grid">${cards}${k2}</div></div>`;
  refit($("#main"));
}

/* ================= events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="btnNext")next();
  else if(t.id==="btnRetryPartial")submitStudy2Partial("study2_imc_failed");
  else if(t.id==="btnRetryAssignment"){S.status=null;S.busy=false;next()}
  else if(t.id==="btnRetryUpload")submitCompletedStudy2();
  else if(t.id==="btnAgain"||t.id==="btnReset"){S=newState(S.study,S);syncJump();setView("survey")}
  else if(t.id==="btnData"){showData=!showData;t.textContent=showData?"Ẩn dữ liệu":"Xem dữ liệu ghi được";if(view==="survey")renderSurvey()}
  else if(t.dataset.view)setView(t.dataset.view);
  else if(t.dataset.study)setStudy(+t.dataset.study);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="selJump"){
    const v=t.value;
    if(v==="end"){S.status={kind:"end"};}
    else{S.status=null;S.idx=+v;
      if(S.study!==1&&S.emb.INTEG==null&&pagesOf().findIndex(p=>p.id==="k1")<=S.idx)assign(S);}
    go();return;
  }
  if(t.dataset.cond){
    const k=t.dataset.cond;S.cond[k]=t.value;
    if(S.emb.INTEG!=null&&t.value!=="r"){
      const key=k==="ORDER"?"ORDER":k;S.emb[key]=+t.value;cellUpdate(S);
    }
    if(view==="survey")renderSurvey();return;
  }
  if(t.id==="tgCodes"){document.body.classList.toggle("show-codes",t.checked);return}
  if(t.id==="tgTimer"){S.flags.noTimer=t.checked;if(view==="survey")renderSurvey();return}
  if(t.id==="tgSkip"){S.flags.allowSkip=t.checked;return}
  if(t.id==="tgShuffle"){S.flags.shuffle=t.checked;S.order={};if(view==="survey")renderSurvey();return}
  if(!$("#main").contains(t))return;
  if(t.type==="radio"){S.ans[t.name]=+t.value}
  else if(t.type==="checkbox"&&t.dataset.multi){
    const c=t.dataset.multi;S.ans[t.name]=t.checked?1:0;
    const box=t.closest(".list");
    if(t.checked){box.querySelectorAll('input[type="checkbox"]').forEach(o=>{if(o!==t&&(t.dataset.excl==="1"||o.dataset.excl==="1")){o.checked=false;S.ans[o.name]=0}})}
    /* store unchecked options as 0 so every option has a code */
    box.querySelectorAll('input[type="checkbox"]').forEach(o=>{if(S.ans[o.name]===undefined)S.ans[o.name]=o.checked?1:0});
  }
  else if(t.type==="number"){S.ans[t.name]=t.value===""?undefined:+t.value}
  const f=t.closest(".q");if(f)f.classList.remove("err");
  if(showData)refreshData();
});
document.addEventListener("input",e=>{
  const t=e.target;if(!$("#main").contains(t))return;
  if(t.tagName==="TEXTAREA"||(t.type==="text")){S.ans[t.name]=t.value;
    if(t.classList.contains("othr")){const base=t.name.replace(/_TEXT$/,"");const radios=document.querySelectorAll(`input[name="${base}"]`);radios.forEach(r=>{if(r.closest("label").contains(t)){r.checked=true;S.ans[base]=+r.value}})}
    const f=t.closest(".q");if(f)f.classList.remove("err")}
  else if(t.type==="number"){S.ans[t.name]=t.value===""?undefined:+t.value}
});
function refreshData(){const w=document.querySelector(".datawrap");if(w)w.outerHTML=dataPanel()}
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>refit(document),80)});

/* ================= boot ================= */
S=newState(2);
const priorStudy2Lock=readStudy2Lock();
if(priorStudy2Lock && ["started","completed","imc_failed"].includes(priorStudy2Lock.status)) S.status={kind:"duplicate"};
renderConds();syncJump();
if(location.hash==="#export"){document.documentElement.classList.add("export-mode");renderGallery(true)}else{renderSurvey()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>refit(document));
})();
</script>
